name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error \
            --output gitleaks-checksums.txt \
            "$base_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  $archive$" gitleaks-checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --redact --no-banner
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate Agent Skill
        run: npx --yes skills-ref@0.1.5 validate skills/analyze-paper
      - name: Check scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/test-install.sh
          python -m py_compile scripts/check_markdown_links.py
          python -m py_compile scripts/check_docs_parity.py
          python -m py_compile scripts/check_public_artifacts.py
          python -m py_compile scripts/validate_examples.py
          python -m py_compile skills/analyze-paper/scripts/validate_note.py
      - name: Check repository documentation and public artifacts
        run: |
          python scripts/check_markdown_links.py
          python scripts/check_docs_parity.py
          python scripts/check_public_artifacts.py
      - name: Validate three-target golden example
        run: |
          python skills/analyze-paper/scripts/validate_note.py examples/deepseekmoe/markdown.md
          python skills/analyze-paper/scripts/validate_note.py examples/deepseekmoe/notion.md
          python skills/analyze-paper/scripts/validate_note.py examples/deepseekmoe/lark.xml
          python scripts/validate_examples.py
      - name: Test validators
        run: python -m unittest discover -s tests -v
      - name: Check public screenshot dimensions
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path

          root = Path("examples/deepseekmoe/screenshots")

          png = (root / "markdown.png").read_bytes()
          assert png[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", png[16:24]) == (1320, 1400)

          def jpeg_size(path: Path) -> tuple[int, int]:
              data = path.read_bytes()
              assert data[:2] == b"\xff\xd8", path.name
              offset = 2
              while offset < len(data):
                  assert data[offset] == 0xFF, path.name
                  marker = data[offset + 1]
                  offset += 2
                  if marker in {0xD8, 0xD9}:
                      continue
                  length = struct.unpack(">H", data[offset:offset + 2])[0]
                  if marker in range(0xC0, 0xC4):
                      height, width = struct.unpack(">HH", data[offset + 3:offset + 7])
                      return width, height
                  offset += length
              raise AssertionError(f"No JPEG size marker: {path.name}")

          assert jpeg_size(root / "lark-overview.jpg") == (7996, 7352)
          assert jpeg_size(root / "lark-full.jpg") == (3828, 18552)
          assert not (root / "notion.png").exists()
          assert not (root / "lark.png").exists()
          PY
      - name: Test installer
        run: bash scripts/test-install.sh
      - name: Parse example configuration
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          path = Path("skills/analyze-paper/assets/config.example.toml")
          with path.open("rb") as handle:
              config = tomllib.load(handle)
          assert config["version"] == 2
          assert config["defaults"]["outputs"] == ["markdown"]
          assert config["defaults"]["depth"] == "deep"
          assert config["media"] == {
              "mode": "markers",
              "max_items": 6,
              "license_policy": "open-or-approved",
          }
          assert config["markdown"]["notes_directory"] == "paper-notes"
          assert "enabled" not in config["notion"]
          assert config["lark"]["doc_format"] == "xml"
          PY
