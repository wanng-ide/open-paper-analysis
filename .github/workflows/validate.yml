name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error \
            --output gitleaks-checksums.txt \
            "$base_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  $archive$" gitleaks-checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --redact --no-banner
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate Agent Skill
        run: npx --yes skills-ref@0.1.5 validate skills/analyze-paper
      - name: Check scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/test-install.sh
          python -m py_compile scripts/check_markdown_links.py
          python -m py_compile skills/analyze-paper/scripts/validate_note.py
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py
      - name: Validate public example
        run: python skills/analyze-paper/scripts/validate_note.py examples/deepseekmoe.md
      - name: Test installer
        run: bash scripts/test-install.sh
      - name: Parse example configuration
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          path = Path("skills/analyze-paper/assets/config.example.toml")
          with path.open("rb") as handle:
              config = tomllib.load(handle)
          assert config["version"] == 1
          assert config["defaults"]["output"] == "markdown"
          assert config["notion"]["enabled"] is False
          PY
